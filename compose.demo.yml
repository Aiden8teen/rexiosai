name: rexios-demo
services:
  db:
    ports: !reset []
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    working_dir: /app/server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rexios}:${POSTGRES_PASSWORD:-rexios_local}@db:5432/${POSTGRES_DB:-rexios}"
      SESSION_SECRET: "${SESSION_SECRET:?Copy .env.example to .env and set SESSION_SECRET}"
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}"
      UPLOAD_DIR: /app/uploads
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-123}"
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  uploads:
